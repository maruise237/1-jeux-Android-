<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12141d">
  <title>Shadow Strike — KamTech</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="fonts/lilita-one-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <button id="btn-pause" class="round-btn" aria-label="Pause"><span class="pause-ico"></span></button>
    <div class="hud-center">
      <div id="hud-level" class="pill">NIVEAU 1</div>
      <div id="hud-kills" class="kills"><i class="crosshair"></i><span id="hud-kills-n">0/0</span><span id="hud-keys" class="keys hidden"></span></div>
      <div id="hud-flash" class="flash-pill hidden" aria-label="Défi éclair"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M14 2 5 14h6l-1 8 9-12h-6Z" fill="currentColor"/></svg><span></span></div>
    </div>
    <div id="hud-gembox" class="gembox"><i class="gem-ico"></i><span id="hud-gems">0</span></div>
  </div>
  <div id="banner"></div>
  <div id="tip" class="hidden"></div>

  <div id="menu" class="overlay">
    <div class="menu-top">
      <div class="gembox"><i class="gem-ico"></i><span id="menu-gems">0</span></div>
      <div class="toggles">
        <button class="round-btn" data-toggle="sfx" aria-label="Sons"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
        <button class="round-btn" data-toggle="music" aria-label="Musique"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17.5V5.5l10-2v12"/><circle cx="6.5" cy="17.5" r="2.6" fill="currentColor"/><circle cx="16.5" cy="15.5" r="2.6" fill="currentColor"/></svg></button>
      <button class="round-btn" data-toggle="vibe" aria-label="Vibrations"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3.5" width="8" height="17" rx="2"/><path d="M4.5 8.5l-2 2 2 2 -2 2M19.5 8.5l2 2-2 2 2 2"/></svg></button>
      </div>
    </div>
    <div class="brand">KamTech Studio</div>
    <h1 class="title"><span>SHADOW</span><span>STRIKE</span></h1>
    <div class="menu-grid">
      <button id="btn-heroes" class="mcard mcard-hero">
        <span class="mcard-txt">Changer<br>d'assassin<small id="menu-hero-name"></small></span>
        <span id="menu-hero"></span>
        <i class="badge hidden" id="badge-heroes">!</i>
      </button>
      <button id="btn-upgrade" class="mcard mcard-up">
        <svg class="mcard-ico" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6 40 24H31V42H17V24H8Z" fill="#7dff5a" stroke="#1c1a2b" stroke-width="4" stroke-linejoin="round"/></svg>
        <span class="mcard-lab">Améliorer</span>
        <i class="badge hidden" id="badge-upgrade">!</i>
      </button>
      <button id="btn-armory" class="mcard mcard-knife">
        <canvas id="menu-knife" width="128" height="128"></canvas>
        <span class="mcard-lab">Armurerie</span>
        <i class="badge hidden" id="badge-armory">!</i>
      </button>
      <button id="btn-outfits" class="mcard mcard-outfit">
        <span id="menu-outfit"></span>
        <span class="mcard-lab">Tenues</span>
        <i class="badge hidden" id="badge-outfits">!</i>
      </button>
    </div>
    <div id="missions"></div>
    <button id="btn-play" class="btn btn-play big"><span>DÉMARRER</span><small id="btn-play-level">NIVEAU 1</small></button>
  </div>

  <div id="shop" class="overlay hidden">
    <div class="ribbon">BOUTIQUE</div>
    <button id="btn-shop-close" class="close-btn" aria-label="Fermer"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="gembox"><i class="gem-ico"></i><span id="shop-gems">0</span></div>
    <div class="tabs" role="tablist">
      <button class="tab" data-tab="upgrade" role="tab">Améliorer</button>
      <button class="tab" data-tab="armory" role="tab">Couteaux</button>
      <button class="tab" data-tab="outfits" role="tab">Tenues</button>
    </div>
    <p id="shop-hint"></p>
    <div id="shop-list"></div>
  </div>

  <div id="heroes" class="overlay hidden">
    <div class="ribbon">ASSASSINS</div>
    <button id="btn-heroes-close" class="close-btn" aria-label="Fermer"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="gembox"><i class="gem-ico"></i><span id="heroes-gems">0</span></div>
    <div id="heroes-grid"></div>
  </div>

  <div id="result" class="overlay hidden">
    <div id="result-title" class="ribbon big"></div>
    <div id="result-stars"><span class="star"></span><span class="star mid"></span><span class="star"></span></div>
    <p id="result-sub"></p>
    <div class="result-gems"><i class="gem-ico big"></i><span id="result-gems">+0</span></div>
    <p id="result-bonus"></p>
    <p id="result-tip" class="hidden"></p>
    <div id="result-unlock" class="unlock hidden"><div class="unlock-pic"></div><div class="unlock-info"><div class="unlock-title">NOUVEL ASSASSIN</div><div class="unlock-bar"><i></i></div><div class="unlock-pct"></div></div></div>
    <button id="btn-wheel" class="btn btn-red hidden">ROUE DE LA CHANCE</button>
    <button id="btn-result" class="btn btn-yellow big">SUIVANT</button>
    <button id="btn-result-menu" class="btn btn-blue">MENU</button>
  </div>

  <div id="pause" class="overlay dim hidden">
    <div class="ribbon">PAUSE</div>
    <button id="btn-resume" class="btn btn-yellow big">REPRENDRE</button>
    <button id="btn-restart" class="btn btn-blue">RECOMMENCER</button>
    <div class="toggles">
      <button class="round-btn" data-toggle="sfx" aria-label="Sons"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button class="round-btn" data-toggle="music" aria-label="Musique"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17.5V5.5l10-2v12"/><circle cx="6.5" cy="17.5" r="2.6" fill="currentColor"/><circle cx="16.5" cy="15.5" r="2.6" fill="currentColor"/></svg></button>
      <button class="round-btn" data-toggle="vibe" aria-label="Vibrations"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3.5" width="8" height="17" rx="2"/><path d="M4.5 8.5l-2 2 2 2 -2 2M19.5 8.5l2 2-2 2 2 2"/></svg></button>
    </div>
    <button id="btn-quit" class="btn btn-red">MENU</button>
  </div>

  <div id="wheel" class="overlay dim hidden">
    <div class="ribbon">ROUE DE LA CHANCE</div>
    <div class="wheel-box"><canvas id="wheel-canvas" width="560" height="560"></canvas><div class="wheel-pin"></div></div>
    <p id="wheel-result"></p>
    <button id="btn-spin" class="btn btn-yellow big">TOURNER</button>
    <button id="btn-wheel-close" class="btn btn-blue hidden">CONTINUER</button>
  </div>

  <div id="promo" class="overlay dim hidden" role="dialog" aria-modal="true" aria-labelledby="promo-title">
    <div class="promo-card">
      <span class="promo-tag">Annonce KamTech</span>
      <button id="btn-promo-close" class="close-btn" aria-label="Fermer"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <img id="promo-img" alt="" class="hidden">
      <h2 id="promo-title"></h2>
      <p id="promo-body"></p>
      <button id="btn-promo-go" class="btn btn-yellow"></button>
      <button id="btn-promo-later" class="promo-later">Plus tard</button>
    </div>
  </div>

  <script src="js/online-config.js"></script>
  <script src="js/online.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/art.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
