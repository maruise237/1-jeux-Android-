<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1017">
  <title>Shadow Strike — KamTech</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-row">
      <span id="hud-level">Niveau 1</span>
      <span id="hud-enemies">🎯 0</span>
      <span id="hud-gems">💎 0</span>
    </div>
    <div class="hp"><div id="hud-hp"></div></div>
  </div>

  <div id="menu" class="overlay">
    <div class="brand">KAMTECH</div>
    <h1>SHADOW<br>STRIKE</h1>
    <p class="tagline">Reste dans l'ombre. Frappe sans bruit.</p>
    <div class="gems">💎 <span id="menu-gems">0</span></div>
    <button id="btn-play" class="btn primary">Jouer — Niveau 1</button>
    <button id="btn-shop" class="btn">Personnages</button>
    <p class="hint">Touche l'écran pour te déplacer.<br>Élimine tous les gardes sans entrer dans leur lumière.</p>
    <footer>© KamTech Studio</footer>
  </div>

  <div id="shop" class="overlay hidden">
    <h2>Personnages</h2>
    <div class="gems">💎 <span id="shop-gems">0</span></div>
    <div id="shop-list"></div>
    <button id="btn-shop-back" class="btn">Retour</button>
  </div>

  <div id="result" class="overlay hidden">
    <h2 id="result-title"></h2>
    <p id="result-text"></p>
    <button id="btn-result" class="btn primary"></button>
    <button id="btn-result-menu" class="btn">Menu</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
